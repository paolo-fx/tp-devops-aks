name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualite:
    name: Qualité et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Contrôle qualité
        run: flake8 .

      - name: Tests et couverture
        run: |
          pytest --cov=app --cov=calendrier \
            --cov-report=term-missing \
            --cov-fail-under=80

  image:
    name: Build et publication de l'image
    needs: qualite
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}

  deploiement:
    name: Déploiement sur AKS
    needs: [qualite, image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: deploiement-aks
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Installer kubectl
        run: |
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Configurer l'accès au cluster
        env:
          KUBECONFIG_CONTENU: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s\n' "$KUBECONFIG_CONTENU" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl auth can-i create deployments

      - name: Déployer sur AKS
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          echo "Déploiement de $IMAGE"

          sed -i -E "s|^([[:space:]]*image:).*|\1 ${IMAGE}|" k8s/deployment.yaml

          kubectl apply -f k8s/
          kubectl rollout status deployment/mon-app --timeout=180s

      - name: Test post-déploiement
        run: |
          kubectl port-forward svc/mon-app 18081:80 > /tmp/portforward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18081/health

          RESPONSE=$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18081/)

          echo "$RESPONSE" | jq -e \
            --arg expected "$GITHUB_SHA" \
            '.version == $expected'